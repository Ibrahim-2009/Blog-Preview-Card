<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
        <link rel="stylesheet" href="style.css">

        <title>Frontend Mentor | Blog preview card</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main>
            <article class="card">
                <img class="course_photo" src="images/illustration-article.svg" alt="Illustration of article">
                <div class="details">
                    <p><span class="course_tag">Learning</span></p>
                    <p class="course_date">Published 21 Dec 2023</p>
                    <h1 class="course_name">HTML & CSS foundations</h1>
                    <p class="course_description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </div>
                <div class="instructor">
                    <img class="instructor_photo" src="images/image-avatar.webp" alt="Greg Hooper">
                    <p class="instructor_name">Greg Hooper</p>
                </div>
            </article>
        </main>
    </body>
</html>
